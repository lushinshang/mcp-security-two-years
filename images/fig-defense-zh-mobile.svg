<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>四道防線落在哪個位置</title><desc>用戶端、MCP 伺服器、授權伺服器、下游服務四個方塊。授權伺服器到用戶端的授權回應：簽發者驗證，有 iss 就驗。用戶端到 MCP 伺服器的 token：受眾驗證，token 要簽發給這台伺服器。MCP 伺服器與授權伺服器之間：逐一用戶端同意，MCP proxy 伺服器必做。MCP 伺服器到下游服務：不直通轉傳，收到的 token 不往下游送（虛線加叉）。</desc><defs><marker id="ah-0b5c51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b5c51"/></marker><marker id="ah-1f5f99" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f5f99"/></marker><marker id="ah-9a4d00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a4d00"/></marker><marker id="ah-a61b1b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a61b1b"/></marker></defs><rect width="520" height="800" rx="16" fill="#fbf7ef"/><rect x="20" y="40" width="170" height="70" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="105.0" y="84.1" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2933">用戶端</text><rect x="330" y="40" width="170" height="70" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="415.0" y="83.4" font-size="24" text-anchor="middle" font-weight="700" fill="#1f2933">授權伺服器</text><rect x="20" y="380" width="170" height="70" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="105.0" y="423.4" font-size="24" text-anchor="middle" font-weight="700" fill="#1f2933">MCP 伺服器</text><rect x="20" y="700" width="170" height="70" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="105.0" y="744.1" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2933">下游服務</text><path d="M328 75 L192 75" fill="none" stroke="#0b5c51" stroke-width="3" marker-end="url(#ah-0b5c51)"/><text x="212" y="150" font-size="26" text-anchor="start" font-weight="700" fill="#0b5c51">簽發者驗證</text><text x="212" y="188" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="212" dy="0">授權回應帶 iss，</tspan><tspan x="212" dy="30">有 iss 就驗</tspan></text><path d="M105 112 L105 378" fill="none" stroke="#1f5f99" stroke-width="3" marker-end="url(#ah-1f5f99)"/><text x="130" y="270" font-size="26" text-anchor="start" font-weight="700" fill="#1f5f99">受眾驗證</text><text x="130" y="308" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="130" dy="0">token 要簽發給</tspan><tspan x="130" dy="30">這台伺服器</tspan></text><path d="M192 415 L430 415 L430 112" fill="none" stroke="#9a4d00" stroke-width="3" marker-end="url(#ah-9a4d00)"/><text x="205" y="462" font-size="26" text-anchor="start" font-weight="700" fill="#9a4d00">逐一用戶端同意</text><text x="205" y="500" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="205" dy="0">MCP proxy </tspan><tspan x="205" dy="30">伺服器必做</tspan></text><path d="M105 452 L105 698" fill="none" stroke="#a61b1b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#ah-a61b1b)"/><line x1="88" y1="600" x2="122" y2="634" stroke="#a61b1b" stroke-width="4"/><line x1="122" y1="600" x2="88" y2="634" stroke="#a61b1b" stroke-width="4"/><text x="150" y="610" font-size="26" text-anchor="start" font-weight="700" fill="#a61b1b">不直通轉傳</text><text x="150" y="648" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="150" dy="0">收到的 token </tspan><tspan x="150" dy="30">不往下游送</tspan></text></svg>