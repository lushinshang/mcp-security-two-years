<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 790" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>同意由誰做決定</title><desc>三張卡片由左至右：人逐次同意（講者說的早期假設，使用者在每次連線時按核准）；管理員事先核准（官方已宣告穩定，員工不再看到同意畫面）；agent 自有身分（IETF 個人草案，服務依身分與宣告做授權決策）。箭頭表示決定權的移動，為本文整理。</desc><defs><marker id="ah-1f2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker></defs><rect width="520" height="790" rx="16" fill="#fbf7ef"/><rect x="40" y="24" width="440" height="188" rx="14" fill="#ffffff" stroke="#52606d" stroke-width="3"/><text x="58" y="58" font-size="22" text-anchor="start" font-weight="700" fill="#52606d">講者說的早期假設</text><text x="58" y="106" font-size="30" text-anchor="start" font-weight="700" fill="#1f2933">人逐次同意</text><text x="58" y="150" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="58" dy="0">使用者在每次連線</tspan><tspan x="58" dy="32">時按核准</tspan></text><path d="M260 216 L260 256" fill="none" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-1f2933)"/><rect x="40" y="260" width="440" height="188" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="3"/><text x="58" y="294" font-size="22" text-anchor="start" font-weight="700" fill="#0b5c51">官方已宣告穩定</text><text x="58" y="342" font-size="30" text-anchor="start" font-weight="700" fill="#1f2933">管理員事先核准</text><text x="58" y="386" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="58" dy="0">員工不再看到</tspan><tspan x="58" dy="32">同意畫面</tspan></text><path d="M260 452 L260 492" fill="none" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-1f2933)"/><rect x="40" y="496" width="440" height="188" rx="14" fill="#ffffff" stroke="#9a4d00" stroke-width="3"/><text x="58" y="530" font-size="22" text-anchor="start" font-weight="700" fill="#9a4d00">IETF 個人草案</text><text x="58" y="578" font-size="30" text-anchor="start" font-weight="700" fill="#1f2933">agent 自有身分</text><text x="58" y="622" font-size="24" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="58" dy="0">服務依身分與宣告</tspan><tspan x="58" dy="32">做授權決策</tspan></text><text x="260" y="740" font-size="22" text-anchor="middle" font-weight="500" fill="#52606d"><tspan x="260" dy="0">箭頭表示決定權的移動，</tspan><tspan x="260" dy="28">為本文整理</tspan></text></svg>