<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>同意由誰做決定</title><desc>三張卡片由左至右：人逐次同意（講者說的早期假設，使用者在每次連線時按核准）；管理員事先核准（官方已宣告穩定，員工不再看到同意畫面）；agent 自有身分（IETF 個人草案，服務依身分與宣告做授權決策）。箭頭表示決定權的移動，為本文整理。</desc><defs><marker id="ah-1f2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2933"/></marker></defs><rect width="840" height="290" rx="16" fill="#fbf7ef"/><rect x="20" y="30" width="240" height="190" rx="14" fill="#ffffff" stroke="#52606d" stroke-width="3"/><text x="38" y="59" font-size="17" text-anchor="start" font-weight="700" fill="#52606d">講者說的早期假設</text><text x="38" y="101" font-size="24" text-anchor="start" font-weight="700" fill="#1f2933">人逐次同意</text><text x="38" y="139" font-size="18" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="38" dy="0">使用者在每次</tspan><tspan x="38" dy="26">連線時按核准</tspan></text><rect x="300" y="30" width="240" height="190" rx="14" fill="#ffffff" stroke="#0b5c51" stroke-width="3"/><text x="318" y="59" font-size="17" text-anchor="start" font-weight="700" fill="#0b5c51">官方已宣告穩定</text><text x="318" y="101" font-size="24" text-anchor="start" font-weight="700" fill="#1f2933">管理員事先核准</text><text x="318" y="139" font-size="18" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="318" dy="0">員工不再看到</tspan><tspan x="318" dy="26">同意畫面</tspan></text><rect x="580" y="30" width="240" height="190" rx="14" fill="#ffffff" stroke="#9a4d00" stroke-width="3"/><text x="598" y="59" font-size="17" text-anchor="start" font-weight="700" fill="#9a4d00">IETF 個人草案</text><text x="598" y="101" font-size="24" text-anchor="start" font-weight="700" fill="#1f2933">agent 自有身分</text><text x="598" y="139" font-size="18" text-anchor="start" font-weight="500" fill="#1f2933"><tspan x="598" dy="0">服務依身分與宣告</tspan><tspan x="598" dy="26">做授權決策</tspan></text><path d="M262 125 L298 125" fill="none" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-1f2933)"/><path d="M542 125 L578 125" fill="none" stroke="#1f2933" stroke-width="3" marker-end="url(#ah-1f2933)"/><text x="420" y="262" font-size="16" text-anchor="middle" font-weight="500" fill="#52606d">箭頭表示決定權的移動，為本文整理</text></svg>