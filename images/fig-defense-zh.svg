<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>四道防線落在哪個位置</title><desc>用戶端、MCP 伺服器、授權伺服器、下游服務四個方塊。授權伺服器到用戶端的授權回應：簽發者驗證，有 iss 就驗。用戶端到 MCP 伺服器的 token：受眾驗證，token 要簽發給這台伺服器。MCP 伺服器與授權伺服器之間：逐一用戶端同意，MCP proxy 伺服器必做。MCP 伺服器到下游服務：不直通轉傳，收到的 token 不往下游送（虛線加叉）。</desc><defs><marker id="ah-0b5c51" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b5c51"/></marker><marker id="ah-1f5f99" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f5f99"/></marker><marker id="ah-9a4d00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a4d00"/></marker><marker id="ah-a61b1b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a61b1b"/></marker></defs><rect width="820" height="390" rx="16" fill="#fbf7ef"/><rect x="320" y="24" width="200" height="66" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="420.0" y="64.7" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">授權伺服器</text><rect x="20" y="226" width="170" height="66" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="105.0" y="266.7" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">用戶端</text><rect x="345" y="226" width="170" height="66" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="430.0" y="266.7" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">MCP 伺服器</text><rect x="630" y="226" width="170" height="66" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="715.0" y="266.7" font-size="22" text-anchor="middle" font-weight="700" fill="#1f2933">下游服務</text><path d="M320 74 L112 224" fill="none" stroke="#0b5c51" stroke-width="3" marker-end="url(#ah-0b5c51)"/><text x="20" y="44" font-size="22" text-anchor="start" font-weight="700" fill="#0b5c51">簽發者驗證</text><text x="20" y="70" font-size="17" text-anchor="start" font-weight="500" fill="#1f2933">授權回應帶 iss，有 iss 就驗</text><path d="M190 259 L343 259" fill="none" stroke="#1f5f99" stroke-width="3" marker-end="url(#ah-1f5f99)"/><text x="267" y="326" font-size="22" text-anchor="middle" font-weight="700" fill="#1f5f99">受眾驗證</text><text x="267" y="352" font-size="17" text-anchor="middle" font-weight="500" fill="#1f2933">token 要簽發給這台伺服器</text><path d="M430 224 L430 92" fill="none" stroke="#9a4d00" stroke-width="3" marker-end="url(#ah-9a4d00)"/><text x="448" y="148" font-size="22" text-anchor="start" font-weight="700" fill="#9a4d00">逐一用戶端同意</text><text x="448" y="174" font-size="17" text-anchor="start" font-weight="500" fill="#1f2933">MCP proxy 伺服器必做</text><path d="M515 259 L628 259" fill="none" stroke="#a61b1b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ah-a61b1b)"/><line x1="560" y1="243" x2="584" y2="275" stroke="#a61b1b" stroke-width="4"/><line x1="584" y1="243" x2="560" y2="275" stroke="#a61b1b" stroke-width="4"/><text x="715" y="326" font-size="22" text-anchor="middle" font-weight="700" fill="#a61b1b">不直通轉傳</text><text x="715" y="352" font-size="17" text-anchor="middle" font-weight="500" fill="#1f2933">收到的 token 不往下游送</text></svg>